<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CitterBank</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --accent-color: #ffdd2d;
            --text-main: #ffffff;
            --text-secondary: #8e8e93;
            --crypto-color: #007aff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .profile-icon {
            width: 40px;
            height: 40px;
            background: var(--card-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .balance-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .balance-label {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .balance-amount {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .balance-usd {
            color: var(--text-secondary);
            font-size: 18px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-name {
            font-size: 16px;
            font-weight: 500;
        }

        .citter-icon {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 20px;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .icon-circle {
            width: 50px;
            height: 50px;
            background: var(--card-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .action-label {
            font-size: 12px;
            color: var(--text-main);
        }

        .history-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .transaction {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #2c2c2e;
        }

        .trans-info {
            display: flex;
            flex-direction: column;
        }

        .trans-name {
            font-weight: 500;
        }

        .trans-date {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .trans-amount {
            font-weight: 600;
            color: #34c759;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="profile-icon">CB</div>
        <div style="font-weight: 600;">CitterBank</div>
        <div style="font-size: 20px;">Your Bank</div>
    </header>

    <div class="balance-section">
        <div class="balance-label">Total in CitterCoin</div>
        <div class="balance-amount" id="balance-c">C$1.45082</div>
        <div class="balance-usd" id="balance-usd">$0.00</div>
    </div>

    <div class="actions">
        <div class="action-btn">
            <div class="icon-circle">+M</div>
            <div class="action-label">+</div>
        </div>
        <div class="action-btn">
            <div class="icon-circle">+T</div>
            <div class="action-label">Translate</div>
        </div>
        <div class="action-btn">
            <div class="icon-circle">-M</div>
            <div class="action-label">Withdraw from card</div>
        </div>
        <div class="action-btn">
            <div class="icon-circle">...</div>
            <div class="action-label">More</div>
        </div>
    </div>

    <div class="card">
        <div class="card-info">
            <span class="card-name">CitterCard</span>
            <span class="citter-icon">C$</span>
        </div>
        <div style="font-size: 22px; font-weight: bold; letter-spacing: 2px;">
            2267 3894 8237 4412
        </div>
        <div style="display: flex; justify-content: space-between; align-items: flex-end;">
            <div style="font-size: 14px; color: var(--text-secondary);">Card</div>
            <div style="font-size: 18px;">C$1.45082</div>
        </div>
    </div>

    <div class="history-title">History</div>
    <div id="transactions">
        <!-- —юда JS добавит операции -->
    </div>
</div>

<script>
    const RATE = 42554.18;
    const balanceC = 1.45082;

    function updateBalance() {
        const usdValue = (balanceC * RATE).toLocaleString('en-US', {
            style: 'currency',
            currency: 'USD',
        });
        document.getElementById('balance-usd').innerText = usdValue;
    }

    const transactions = [
        { name: 'Buy in Apple Store', date: 'Today', amount: '-C$0.0024', color: '#ff3b30'},
        { name: 'Translation from Alexey', date: 'Yesterday', amount: '+C$0.407128' },
{ name: 'Translation from Max', date: 'Yesterday', amount: '+C$0.046092' },
        { name: 'Buy in CitterCoinStore', date: 'May 14 2025', amount: '+C$1' }
    ];

    function renderHistory() {
        const container = document.getElementById('transactions');
        transactions.forEach(t => {
            const div = document.createElement('div');
            div.className = 'transaction';
            div.innerHTML = `
                <div class="trans-info">
                    <span class="trans-name">${t.name}</span>
                    <span class="trans-date">${t.date}</span>
                </div>
                <div class="trans-amount" style="color: ${t.color || '#34c759'}">${t.amount}</div>
            `;
            container.appendChild(div);
        });
    }

    updateBalance();
    renderHistory();
</script>

</body>
</html>
